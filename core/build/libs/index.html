<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Craft2d</title>
    <!-- CheerpJ Runtime laden, um Java im Browser auszuführen -->
    <script src="https://cjrtnc.leaningtech.com/3.0/loader.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <script>
        async function main() {
            // CheerpJ initialisieren
            await cheerpjInit();
            // Bildschirm-Auflösung im Browser (1440x960 Pixel)
            cheerpjCreateDisplay(1440, 960);
            // Deine .jar-Datei direkt im Browser starten
            await cheerpjRunJar("/app/craft2d-1.0.0.jar");
        }
        main();
    </script>
</body>
</html>
